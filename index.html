<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CAN AQHI Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <style>
    html,body{height:100%;margin:0}
    #map{height:100vh;width:100%}
    .ctl {
      background:#fff; padding:8px 10px; border:1px solid #888; border-radius:6px;
      box-shadow: 0 1px 3px rgba(0,0,0,.2); font: 14px/1.2 system-ui, Arial;
    }
    .legend {
      position: fixed;
      bottom: 20px;
      left: 12px;
      background: #fff;
      border:1px solid #888;
      border-radius:6px;
      padding:8px;
      font:12px/1.2 system-ui, Arial;
      z-index: 9999;
    }  
    .legend .sw{display:inline-block;width:14px;height:14px;border:1px solid #333;margin-right:4px}
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script>
  (async function() {
    const map = L.map('map', {
      preferCanvas: true
    }).setView([56, -106], 4);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      maxZoom:18, attribution:'&copy; OpenStreetMap'
    }).addTo(map);
    
    // ===============================
    // FireSmoke PNG overlays
    // ===============================
    
    const smokeBounds = [
      [35, -145],
      [75, -85]
    ];
    

    const smokeFrames = {};
    
    for (let h = 0; h <= 24; h += 2) {
      const key = `${String(h).padStart(2, '0')}h`;
    
      smokeFrames[key] = L.imageOverlay(
        `https://raw.githubusercontent.com/DKevinM/AB_datapull/main/data/output/firesmoke_${key}.png`,
        smokeBounds,
        { opacity: 0.90 }
      );
    }
    
    // default frame
    smokeFrames["00h"].addTo(map);
      

    // ===============================
    // FireSmoke animation control
    // ===============================
    
    const SmokeCtl = L.Control.extend({
    
      onAdd: function() {
    
        const div = L.DomUtil.create('div', 'ctl');
    

        div.innerHTML = `
          <div><b>FireSmoke</b></div>
        
          ${Array.from({length: 13}, (_, i) => {
            const h = i * 2;
            const key = `${String(h).padStart(2, '0')}h`;
            const label = h === 0 ? 'Now' : `+${h}h`;
            return `<label><input type="radio" name="smoke" value="${key}" ${h === 0 ? 'checked' : ''}> ${label}</label><br>`;
          }).join('')}
        
          <br>
          <button id="playSmoke">Play</button>
        `;
    
        L.DomEvent.disableClickPropagation(div);
    
        let currentSmokeLayer = smokeFrames["00h"];
        
        function showFrame(name) {
        
          const nextLayer = smokeFrames[name];
        
          // already active
          if (currentSmokeLayer === nextLayer) return;
        
          // add next layer FIRST
          if (!map.hasLayer(nextLayer)) {
            nextLayer.setOpacity(0);
            nextLayer.addTo(map);
          }
        
          let opacity = 0;
        
          const fade = setInterval(() => {
        
            opacity += 0.15;
        
            nextLayer.setOpacity(opacity);
        
            if (opacity >= 0.9) {
        
              clearInterval(fade);
        
              // remove previous AFTER fade complete
              if (currentSmokeLayer && map.hasLayer(currentSmokeLayer)) {
                map.removeLayer(currentSmokeLayer);
              }
        
              currentSmokeLayer = nextLayer;
            }
        
          }, 40);
        }
    
        div.querySelectorAll('input[name="smoke"]').forEach(r => {
    
          r.addEventListener('change', e => {
            showFrame(e.target.value);
          });
    
        });
    
        let playing = false;
        let timer = null;
    
        div.querySelector('#playSmoke').addEventListener('click', () => {
    
          if (playing) {
    
            clearInterval(timer);
            playing = false;
            return;
          }
    
          playing = true;
    
          const order = Object.keys(smokeFrames);
    
          let i = 0;
    
          timer = setInterval(() => {
    
            i = (i + 1) % order.length;
    
            const next = order[i];
    
            showFrame(next);
    
            const radio = div.querySelector(`input[value="${next}"]`);
    
            if (radio) {
              radio.checked = true;
            }
    
          }, 1200);
    
        });
    
        return div;
      }
    });
    
    new SmokeCtl({ position: 'bottomright' }).addTo(map);

    

    
    // --- palette / helpers ---
    const PALETTE = ["#01cbff","#0099cb","#016797","#fffe03","#ffcb00","#ff9835","#fd6866","#fe0002","#cc0001","#9a0100","#640100"];
    const MISSING = "#9e9e9e";
    
    function aqhiNumber(v){
      if (v === null || v === undefined || v === '') return null;
      const n = Number.parseFloat(String(v).replace('+',''));
      return Number.isFinite(n) ? n : null;
    }
    
    function aqhiDisplay(v){
      const n = aqhiNumber(v);
      if (n === null || n <= 0) return '—';
      if (n > 10) return '10+';
      return String(Math.round(n));
    }
    
    function aqhiColor(v){
      const label = aqhiDisplay(v);
      if (label === '—') return MISSING;
      if (label === '10+') return PALETTE[10];
      const n = Number(label);
      return PALETTE[Math.max(1, Math.min(10, n)) - 1];
    }

    async function fetchJSON(url){
      const r = await fetch(url);
      if (!r.ok) throw new Error(`HTTP ${r.status} ${url}`);
      return r.json();
    }

    function pickPeriodIndexByCategory(p, category){
      const labels = [];
      for (let i=1;i<=5;i++){
        const lbl = (p[`p${i}_label`] || '').toString().toLowerCase();
        labels.push(lbl);
      }
      const has = (i, s) => labels[i-1].includes(s);

      const isToday = i => has(i,'today') || has(i,'this morning') || has(i,'this afternoon') || (has(i,'this evening') && !has(i,'tonight'));
      const isTonight = i => has(i,'tonight') || has(i,'overnight') || has(i,'this night');
      const isTomorrow = i => (has(i,'tomorrow') && !has(i,'night')) || has(i,'tomorrow daytime') || has(i,'tomorrow afternoon') || has(i,'tomorrow morning');
      const isTomorrowNight = i => has(i,'tomorrow night') || has(i,'tomorrow evening') || has(i,'tomorrow overnight');

      let test;
      if (category==='today') test = isToday;
      else if (category==='tonight') test = isTonight;
      else if (category==='tomorrow') test = isTomorrow;
      else if (category==='tomorrow_night') test = isTomorrowNight;

      if (test){
        for (let i=1;i<=5;i++) if (test(i)) return i;
      }
      const fallback = { today:1, tonight:2, tomorrow:3, tomorrow_night:4 };
      return fallback[category] || 1;
    }

    // ===== OPTIMIZED: Create shared canvas renderer ONCE =====
    const canvasRenderer = L.canvas();

    // --- State ---
    let fcstLayer = null;
    const markerMap = new Map(); // locationKey -> {marker, props}
    let currentCategory = 'today';

    // --- BUILD POPUP HTML (memoized per location) ---
    function buildPopupHtml(props, category) {
      const cats = [
        ['today','Today'],
        ['tonight','Tonight'],
        ['tomorrow','Tomorrow'],
        ['tomorrow_night','Tomorrow night'],
      ];
      const labelMap = { today:'Today', tonight:'Tonight', tomorrow:'Tomorrow', tomorrow_night:'Tomorrow night' };
      const idx = pickPeriodIndexByCategory(props, category);
      const val = props[`p${idx}_aqhi`];
      
      let html = `<b>${props.name ?? '(unknown)'}</b><br>`;
      html += `${labelMap[category]}: AQHI ${aqhiDisplay(val)}<br>`;
      html += '<table style="font-size:12px">';
      for (const [key,label] of cats){
        const i = pickPeriodIndexByCategory(props, key);
        const v = props[`p${i}_aqhi`];
        html += `<tr><td>${label}</td><td style="padding-left:8px;">AQHI ${aqhiDisplay(v)}</td></tr>`;
      }
      html += '</table>';
      return html;
    }

    // ===== OPTIMIZED: Load GeoJSON ONCE =====
    try {
      console.time('forecast-load');
      const fcst = await fetchJSON('./data/aqhi_forecasts.geojson');

      // ===== CREATE ALL MARKERS ONCE =====
      fcstLayer = L.geoJSON(fcst, {
        pointToLayer: (f, latlng) => {
          const p = f.properties || {};
          const locationKey = `${latlng.lat},${latlng.lng}`;
          
          // Get initial color for 'today'
          const idx = pickPeriodIndexByCategory(p, currentCategory);
          const val = p[`p${idx}_aqhi`];
          const c = aqhiColor(val);

          // Create marker with SHARED canvas renderer
          const marker = L.circleMarker(latlng, {
            renderer: canvasRenderer,
            radius: 8,
            color: '#222',
            fillColor: c,
            weight: 1.5,
            opacity: 1,
            fillOpacity: 0.9
          });

          // ===== BIND POPUP ONCE (content updated later per category) =====
          marker.bindPopup('');
          marker._categoryForPopup = currentCategory;

          // ===== STORE REFERENCE =====
          markerMap.set(locationKey, { marker, props: p });
          
          return marker;
        }
      }).addTo(map);

      console.timeEnd('forecast-load');

    } catch(e) {
      console.error('Forecast load FAILED:', e);
    }

    // ===== OPTIMIZED: Update colors & popup text on category change =====
    function updateForecastLayer(category) {
      for (const [, { marker, props }] of markerMap) {
        const idx = pickPeriodIndexByCategory(props, category);
        const val = props[`p${idx}_aqhi`];
        const c = aqhiColor(val);

        // Update color only
        marker.setStyle({ fillColor: c });

        // Update popup HTML (lazy: only if popup is opened)
        // This avoids updating thousands of popups unnecessarily
        if (marker.isPopupOpen()) {
          marker.setPopupContent(buildPopupHtml(props, category));
        } else {
          // Store category for lazy popup generation on click
          marker._categoryForPopup = category;
        }
      }
    }

    // ===== OPTIMIZED: Generate popup content ON DEMAND =====
    // Override popup opening to inject current category's content
    map.on('popupopen', (e) => {
      const popup = e.popup;
      if (popup._source && popup._source._categoryForPopup !== undefined) {
        const marker = popup._source;
        const { props } = markerMap.get(`${marker.getLatLng().lat},${marker.getLatLng().lng}`) || {};
        if (props) {
          popup.setContent(buildPopupHtml(props, currentCategory));
        }
      }
    });

    // --- Control: Forecast period (radio) ---
    const PeriodCtl = L.Control.extend({
      onAdd: function() {
        const div = L.DomUtil.create('div', 'ctl');
        div.id = 'forecast-period-ctl';
        div.innerHTML = `
          <div><b>Forecast Period</b></div>
          <label><input type="radio" name="p" value="today" checked> Today</label><br>
          <label><input type="radio" name="p" value="tonight"> Tonight</label><br>
          <label><input type="radio" name="p" value="tomorrow"> Tomorrow</label><br>
          <label><input type="radio" name="p" value="tomorrow_night"> Tomorrow night</label>
        `;
        L.DomEvent.disableClickPropagation(div);
        
        // ===== OPTIMIZED: Bind listeners ONCE on control creation =====
        const handleChange = (e) => {
          currentCategory = e.target.value;
          updateForecastLayer(currentCategory);
        };
        
        div.querySelectorAll('input[name="p"]').forEach(r => {
          r.addEventListener('change', handleChange);
        });
        
        return div;
      },
      onRemove: function() {}
    });
    new PeriodCtl({ position: 'topright' }).addTo(map);

    // Legend
    const legend = document.createElement('div');
    legend.className = 'legend';
    legend.innerHTML = `
    <b>AQHI</b><br>
    <div style="display:flex;gap:6px;align-items:flex-end;">
      ${PALETTE.map((c,i) => `
        <div style="text-align:center;">
          <div class="sw" style="background:${c}; margin:0 auto;"></div>
          <div style="font-size:10px; margin-top:2px;">
            ${i < 10 ? i+1 : "10+"}
          </div>
        </div>
      `).join('')}
    </div>
    <div style="margin-top:6px;font-size:11px;">grey = missing</div>
    `;
    document.body.appendChild(legend);

  })();
  </script>
</body>
</html>
